html,body{margin:0;background:#03020a;color:#c9d1e3;font-family:system-ui,sans-serif;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
body{position:fixed;inset:0}
#wrap{height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;box-sizing:border-box;padding:4px}
@media (orientation:landscape){#wrap{justify-content:center;padding:0}}
canvas{display:block;width:min(100%,calc((100dvh - 8px)*16/9));max-width:1280px;height:auto;aspect-ratio:640/360;background:#000;outline:none;border-radius:6px;touch-action:none}
#rot{display:none;margin-top:14px;font:10px/1.8 "PS2P",monospace;color:#ffd84a;text-align:center;opacity:.8}
@media (orientation:portrait) and (pointer:coarse){#rot{display:block}}
/* phone controls: under the screen when upright, in the corners when sideways */
#pad{display:none;width:100%;max-width:560px;box-sizing:border-box;justify-content:space-between;align-items:center;gap:8px;margin-top:14px;padding:0 6px;user-select:none;-webkit-user-select:none;touch-action:none}
body.touch #pad{display:flex}
#pad .g{display:flex;align-items:center;gap:10px}
.dp{display:grid!important;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px);gap:4px}
.dp .btn{width:58px;height:58px;border-radius:12px;font-size:20px}
.dp [data-a=u]{grid-area:1/2}.dp [data-a=l]{grid-area:2/1}.dp [data-a=r]{grid-area:2/3}.dp [data-a=d]{grid-area:3/2}
.dp i{grid-area:2/2;width:70%;height:70%;justify-self:center;align-self:center;border-radius:50%;background:#0d1124;border:2px solid #3a3f55}
.col{display:flex;flex-direction:column;gap:12px;align-items:center}
.btn{box-sizing:border-box;width:74px;height:64px;border-radius:32px;border:2px solid #3a3f55;background:#141a2e;color:#e9eef8;font-weight:800;font-size:13px;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:pointer;-webkit-tap-highlight-color:transparent;letter-spacing:.5px;transition:transform .1s ease}
.btn.on{background:#2a3456;transform:scale(.95)}
.btn.ok{width:104px;height:74px;border-radius:37px;font-size:17px;border-color:#9dff6f;color:#c8ffb0}
.btn.bk{width:92px;height:56px;border-color:#ff9a3a;color:#ffd0a8}
@media (orientation:landscape) and (max-height:520px){
 #wrap{padding:0 calc(104px + env(safe-area-inset-right)) 0 calc(170px + env(safe-area-inset-left))}
 canvas{width:min(100%,calc((100dvh - 8px)*16/9))}
 #pad{position:fixed;inset:0;max-width:none;margin:0;padding:10px max(8px,env(safe-area-inset-right)) 10px max(8px,env(safe-area-inset-left));align-items:flex-end;pointer-events:none}
 #pad .g{pointer-events:auto;flex-direction:column}
 .dp{grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px)}.dp .btn{width:48px;height:48px}
 .btn.ok{width:88px;height:64px}.btn.bk{width:80px;height:48px}

<script>// Shared by the in-game stamp and verify.html. Client-side only: deters casual fakes, not tamper-proof.
var SRC = (function () {
  var SALT = "SR-ARCADE:santt-space-station:lets-ride:v1";
  var B32 = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  var GAMES = { CAS: "SPACE RIDERS: ANDROMEDA CASINO", KRT: "SPACE RIDERS KART", GSF: "SPACE SAGA OF FATE: GOLDEN VS SILVER FORCE", BRD: "ROS BOUNTY RUN: DAILY RIDER", HRV: "HUNTER RIDER: VOID ANOMALIES", CBD: "SPACE RIDERS: COSMIC BOARD", FTR: "SPACE RIDERS FIGHTER", SKQ: "SKIPPY'S QUEST", SSQ: "STAR SQUADRON", DST: "DREAM STRIKE", STS: "STATION STRIKE", SNS: "SUPERNOVA SHOWDOWN" };
  function normName(s) { s = String(s || "").toUpperCase().replace(/[^A-Z0-9 .\-]/g, "").replace(/\s+/g, " ").trim().slice(0, 12); return s || "RIDER"; }
  function norm(f) { return { game: String(f.game || "").toUpperCase().trim(), name: normName(f.name), date: String(f.date || "").trim(), time: String(f.time || "").trim(), serial: String(f.serial || "").toUpperCase().trim() }; }
  async function code(f) { f = norm(f); var s = [f.game, f.name, f.date, f.time, f.serial, SALT].join("|");
    var h = new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s))); var o = "", v = 0, b = 0;
    for (var i = 0; i < h.length && o.length < 8; i++) { v = ((v << 8) | h[i]) & 0xffff; b += 8; while (b >= 5 && o.length < 8) { o += B32[(v >> (b - 5)) & 31]; b -= 5; } } return o; }
  function rnd(n) { var a = new Uint8Array(n); crypto.getRandomValues(a); var o = ""; for (var i = 0; i < n; i++) o += B32[a[i] & 31]; return o; }
  return { SALT: SALT, B32: B32, GAMES: GAMES, normName: normName, norm: norm, code: code, rnd: rnd };
})();
