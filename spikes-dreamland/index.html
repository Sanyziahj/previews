}

function solid(ch){return ch==='#'||ch==='>'||ch==='<'||ch==='U'||ch==='q'||ch==='R'||ch==='L';}

function build(def){
  const W=def.w, grid=Array.from({length:ROWS},()=>Array(W).fill('.'));
  const gaps=def.gaps||[];
  const inGap=x=>gaps.some(([a,b])=>x>=a&&x<b);
  for(let x=0;x<W;x++){ if(!inGap(x)){grid[13][x]='#'; grid[14][x]='#';} else grid[14][x]='~'; }
  for(const p of def.plats||[]){ for(let i=0;i<p[2];i++){const x=p[0]+i; if(x>=0&&x<W&&p[1]>=0&&p[1]<ROWS) grid[p[1]][x]='=';} }
  for(const b of def.belts||[]){ for(let i=0;i<b.len;i++){const x=b.x+i; if(x>=0&&x<W&&(grid[b.y][x]==='#'||grid[b.y][x]==='=')) grid[b.y][x]=b.ch;} }
  grid[11][def.goal]='|'; grid[12][def.goal]='|';
  if(def.secret!=null){ grid[def.secretY][def.secret]='S'; }
  for(const c of def.check||[]) grid[12][c]='c';
  const stamp=(ch,arr)=>{ for(const it of arr||[]){ const x=it[0], y=it[1]; if(y>=0&&y<ROWS&&x>=0&&x<W) grid[y][x]=ch; } };
  stamp('+',def.cross); stamp('F',def.blaster); stamp('o',def.sparks?def.sparks.map(x=>[x,12]):[]);
  if(def.board) grid[def.board[1]][def.board[0]]='B';
  if(def.buddy) grid[12][def.buddy]='Y';
  if(grid[13][def.start]!=='#'&&grid[13][def.start]!=='>') throw new Error('start air '+def.id);
  if(grid[13][def.goal]!=='#'&&grid[13][def.goal]!=='>') throw new Error('goal air '+def.id);
  for(const tx of def.walkers||[]) if(grid[13][tx]!=='#'&&grid[13][tx]!=='>') throw new Error('walker gap '+def.id+' '+tx);
  if(def.secret!=null){ const ch=grid[def.secretY+1][def.secret]; if(ch!=='='&&ch!=='<'&&ch!=='>'&&ch!=='#') throw new Error('secret plat '+def.id); }
  if(def.board){ const ch=grid[def.board[1]+1][def.board[0]]; if(ch!=='='&&!solid(ch)) throw new Error('board plat '+def.id); }
  const extras=decorate(def,grid);
  return {def,grid,w:W,world:def.world,name:def.name,id:def.id,low:def.low||null,tips:def.tips||[],extras};
}
function decorate(def,grid){
  const W=def.w, gaps=def.gaps||[];
  const inGap=x=>x<0||x>=W||gaps.some(([a,b])=>x>=a&&x<b);
  const nearGap=x=>gaps.some(([a,b])=>x>=a-8&&x<b+8);
  const reserved=new Set();
  const reserve=x=>{if(x>=0&&x<W) reserved.add(x);};
  for(let i=-3;i<=4;i++) reserve(def.start+i);
  const lead=W<56?6:12;
  for(let i=-lead;i<=3;i++) reserve(def.goal+i);
  if(def.secret!=null) [def.secret-1,def.secret,def.secret+1].forEach(reserve);
  if(def.board) reserve(def.board[0]);
  (def.walkers||[]).forEach(reserve);
  (def.cross||[]).forEach(c=>reserve(c[0]));
  (def.blaster||[]).forEach(c=>reserve(c[0]));
  (def.hoppers||[]).forEach(h=>reserve(h.x));
  const extras=[];
  for(let x=5;x<W-5;x++){
    if(reserved.has(x)||inGap(x)) continue;
    if(x%8===4 && !nearGap(x) && !nearGap(x+2)){
      const y=7+(Math.floor(x/8)%3);
      let ok=true;
      for(let i=0;i<3;i++) if(inGap(x+i)||grid[y][x+i]!=='.') ok=false;
      if(ok){ for(let i=0;i<3;i++) grid[y][x+i]='='; x+=2; }
    }
    if(x%11===7 && !nearGap(x) && grid[12][x]==='.' && grid[11][x]==='.'){ grid[12][x]='U'; grid[11][x]='U'; }
    if(x%9===2 && grid[8][x]==='.' && !inGap(x)) grid[8][x]='q';
    if(x%17===12 && !nearGap(x) && !reserved.has(x+1) && !reserved.has(x+2) && !inGap(x+1) && !inGap(x+2) && grid[12][x]==='.' && grid[12][x+1]==='.' && grid[12][x+2]==='.'){
      grid[12][x]='R'; grid[12][x+1]='#'; grid[12][x+2]='L';
    }
    if(x%3===1 && !inGap(x) && grid[12][x]==='.'){
      const wave=10+((x%12)<6?(x%6):(6-(x%6)));
      extras.push({kind:'spark',x:x*TS+6,y:wave*TS+6,w:18,h:18,alive:true,tx:x,ty:wave});
    }
  }
  return extras;
}

function tickFoe(e){
  if(!e||e.dead) return;
  e.t=(e.t||0)+1;
  if(e.kind==='glitch'){e.hide=(Math.floor(e.t/24)%2)===1; if(!e.hide) e.x+=Math.sin(e.t/9)*0.9; return;}
  if(e.kind==='crater'){e.hide=(Math.floor(e.t/50)%3)===0; if(e.hide) return; if(e.hover){e.y=e.base+((e.t%50)<8?-10:0); return;}}
  if(e.kind==='prize'){e.y=e.base-Math.abs(Math.sin(e.t/9))*28; e.x+=Math.sin(e.t/22)*0.35; return;}
  if(e.hover){
    if(!e.dir) e.dir=1;
    const sp=e.kind==='imp'?1.15:e.kind==='shard'?1.25:e.kind==='eye'?0.9:e.kind==='sand'?1.5:e.kind==='moon'?0.7:e.kind==='balloon'?0.32:e.kind==='floater'?0.26:e.kind==='puff'?0.4:0.45;
    if(e.kind!=='turret'){e.x+=e.dir*sp; if(e.x<e.minX||e.x>e.maxX) e.dir*=-1;}
    if(e.kind==='lantern') e.y=e.base+(e.t%90<22?26:0);
    else if(e.kind!=='turret') e.y=e.base+Math.sin(e.t/(e.kind==='floater'?28:14)+e.ph)*(e.kind==='floater'?30:e.kind==='balloon'?18:16);
    if(e.kind==='sand'){const dx=player.x-e.x; if(Math.abs(dx)<240&&Math.abs(player.y-e.y)<90) e.x+=Math.sign(dx||1)*2.5;}
    if(e.kind==='ring'&&e.t%75===0) bolts.push({x:e.x,y:e.y+6,vx:-2.1,vy:0,w:16,h:12,life:46,side:'foe',k:'ring'});
    if(e.kind==='moon'&&e.t%85===0) bolts.push({x:e.x,y:e.y+8,vx:-1.5,vy:0,w:10,h:8,life:70,side:'foe',k:'pellet'});
    if(e.kind==='turret'&&(e.t%110)<16) beams.push({x:e.x-170,y:e.y+8,w:170,h:8,life:2});
    return;
  }
  const dir=Math.sign(e.vx)||1;
  if(e.kind==='sand'){const dx=player.x-e.x; if(Math.abs(dx)<220&&Math.abs(player.y-e.y)<52) e.vx=Math.sign(dx||1)*2.6; else if(Math.abs(e.vx)<0.4) e.vx=dir*0.75;}
  const ax=e.x+(dir>0?e.w+2:-2);
  const floorCh=tile(Math.floor(ax/TS),Math.floor((e.y+e.h+2)/TS));
  const wallCh=tile(Math.floor(ax/TS),Math.floor((e.y+8)/TS));
  if(!(solid(floorCh)||floorCh==='=')) e.vx*=-1;
  if(solid(wallCh)) e.vx*=-1;
  if((e.kind==='hopper'||e.kind==='crater')&&e.onGround&&e.t%80===0) e.vy=-8;
  if(e.kind==='moon'&&e.t%90===0) bolts.push({x:e.x,y:e.y+6,vx:-(Math.sign(e.vx)||1)*1.5,vy:0,w:10,h:8,life:80,side:'foe',k:'pellet'});
  e.vy=Math.min(9,e.vy+0.55); const ey=e.y; moveBody(e,ey);
}

function resolveX(ent){let g=0; for(const t of rectTiles(ent.x,ent.y,ent.w,ent.h)){ if(!solid(t.ch)) continue; if(ent.vx>0) ent.x=t.tx*TS-ent.w; else if(ent.vx<0) ent.x=(t.tx+1)*TS; else {const dl=(ent.x+ent.w)-t.tx*TS, dr=(t.tx+1)*TS-ent.x; ent.x=dl<dr?t.tx*TS-ent.w:(t.tx+1)*TS;} ent.vx=0; if(++g>6) break; }}
function resolveY(ent,prevY){
  ent.onGround=false; ent.onOneWay=false; let g=0;
  const rising=ent===player&&ent.vy<0;
  for(const t of rectTiles(ent.x,ent.y,ent.w,ent.h)){ if(!solid(t.ch)) continue; if(ent.vy>=0){ent.y=t.ty*TS-ent.h; ent.onGround=true;} else {ent.y=(t.ty+1)*TS; if(rising) headBump=true;} ent.vy=0; if(++g>6) break; }

  for(const t of rectTiles(ent.x+1,Math.min(prevY,ent.y),ent.w-2,Math.abs(ent.y-prevY)+ent.h)){
    if(t.ch!=='=') continue; const top=t.ty*TS;
    if(prevFeet<=top+3 && feet>=top && feet<=top+TS){ent.y=top-ent.h; ent.vy=0; ent.onGround=true; ent.onOneWay=true;}
  }
}

function dangerLine(){return boss?boss.minX-8:1e9;}

function stepBoss(){
  if(!boss||boss.done) return;
  inputLog.push({l:!!held.left,r:!!held.right,j:!!held.jump}); if(inputLog.length>48) inputLog.shift();

    else if(t==='copy'){if(inputLog.length>=18){const old=inputLog[inputLog.length-18]; const dir=(old.r?1:0)-(old.l?1:0); boss.vx=dir*2.3; if(old.j&&boss.onGround) boss.vy=-8;} else boss.vx*=0.8;}
    else if(t==='star'){boss.vx+=(boss.home+80-boss.x)*0.02; boss.vx=Math.max(-1.4,Math.min(1.4,boss.vx)); if(anim%70===0) bolts.push({x:boss.x-8,y:boss.y+16,vx:-4.4,vy:0,w:12,h:10,life:70,side:'foe',k:'star'});}
    else if(t==='hop'){boss.dir=player.x<boss.x?-1:1; boss.vx=boss.dir*1.3; if(boss.onGround&&anim%48===0) boss.vy=-10; if(!boss.onGround&&boss.vy>0) boss.vy-=0.18;}
    boss.vx=Math.max(-6,Math.min(6,boss.vx));
  } else if(boss.kind==='spike'){
    boss.smile=boss.phase===3; boss.vx=Math.sin(anim/28)*1.1; 
    if(boss.phase===1&&anim%50===0) rings.push({x:boss.x+boss.w/2,y:boss.y+30,r:36,grow:0,life:80,orb:true,ang:anim});
    if(boss.phase===2&&illusions.length===0){illusions=[{x:boss.x-70,y:boss.y-78,w:42,h:60,vx:0.6,dead:false},{x:boss.x+80,y:boss.y-90,w:42,h:60,vx:-0.5,dead:false}];}
    if(boss.phase===3&&anim%45===0){const tx=boss.minX+40+((anim/45|0)%6)*36; drops.push({x:tx,y:40,vy:3.1,w:18,h:18,life:120});}

    if(anim%110===0) bubbles.push({x:boss.x,y:boss.y+20,vx:-1.5,vy:0,w:18,h:18,life:180,ph:anim});
  } else if(boss.kind==='spark'){
    boss.y=GY*TS-boss.h-18+Math.sin(anim/16)*14; boss.vx=Math.sin(anim/28)*1.15;
    if(anim%42===0) bolts.push({x:boss.x-6,y:boss.y+18,vx:-3.1,vy:1.15,w:12,h:10,life:75,side:'foe',k:'shard'});
  } else if(boss.kind==='sentinel'){
    boss.dir=player.x<boss.x?-1:1; const charge=anim%150<28; boss.vx=boss.dir*(charge?2.5:0.55);
  } else if(boss.kind==='frightjr'){
    boss.dir=player.x<boss.x?-1:1; boss.vx=boss.dir*0.95; if(boss.onGround&&anim%52===0) boss.vy=-8.2;
  } else {

    const sp=boss.kind==='ram'&&anim%140<30?2.2:1;
    boss.vx=boss.dir*sp;
    if(boss.kind==='beacon'&&boss.onGround&&anim%70===0) boss.vy=-7;

  }

function fightHits(){
  for(const e of enemies){
    if(e.dead||e.hide||!overlap(player,e)) continue;
    const prev=player.y+PH-player.vy;
    if(player.vy>0&&prev<=e.y+10){popFoe(e); player.vy=held.jump?-9:-6; shake=Math.max(shake,4); continue;}
    if(mounted){popFoe(e); continue;}
    hurt();
  }
  if(boss&&!boss.done&&overlap(player,boss)){
    const prev=player.y+PH-player.vy;
    if(player.vy>0&&prev<=boss.y+14){damageBoss(false); player.vy=held.jump?-9:-6.4;}
    else hurt();
  }
  for(const il of illusions){if(!il.dead&&overlap(player,il)) hurt();}
  for(const b of bolts){
    if(b.life<=0) continue;
    if(b.side==='foe'){
      if(boss&&b.x<dangerLine()){b.life=0; burst(dangerLine(),b.y,5,'sparkle'); continue;}
      if(overlap(b,player)){b.life=0; hurt();}
      for(const p of bolts){if(p.side==='me'&&p.life>0&&overlap(b,p)){b.life=0; p.life=0; burst(b.x,b.y,6,'sparkle');}}
    } else {
      for(const e of enemies){if(!e.dead&&!e.hide&&overlap(b,e)){b.life=0; popFoe(e);}}
      if(boss&&!boss.done&&overlap(b,boss)){b.life=0; damageBoss(false);}
      for(const il of illusions){if(!il.dead&&overlap(b,il)){b.life=0; il.dead=true; burst(il.x,il.y,8,'sparkle');}}
      for(const bb of bubbles){if(bb.life>0&&overlap(b,bb)){b.life=0; bb.life=0; burst(bb.x,bb.y,6,'fluff');}}
      for(const d of drops){if(d.life>0&&overlap(b,d)){b.life=0; d.life=0; burst(d.x,d.y,5,'sparkle');}}
    }
  }
  for(const bb of bubbles){if(bb.life<=0) continue; if(boss&&bb.x<dangerLine()){bb.life=0; burst(dangerLine(),bb.y,5,'sparkle'); continue;} if(overlap(bb,player)){bb.life=0; hurt();}}
  for(const d of drops){if(d.life>0&&overlap(d,player)){d.life=0; if(!safeStand()) hurt(); else {d.life=0;}}}
  for(const bm of beams){if(bm.life>0&&overlap(bm,player)) hurt();}
  for(const r of rings){
    if(!r.hurt){
      if(r.orb){const ox=r.x+Math.cos(r.ang)*r.r, oy=r.y+Math.sin(r.ang)*r.r; if(!safeStand()&&Math.abs(player.x-ox)<16&&Math.abs(player.y-oy)<16) hurt();}
      continue;
    }
    const cx=player.x+PW/2, cy=player.y+PH*0.7, dist=Math.hypot(cx-r.x,cy-r.y);
    if(Math.abs(dist-r.r)<18 && player.x+PW>dangerLine()-10) hurt();
  }
}

function botThink(){
  if(dialog){held.left=held.right=held.blast=held.back=held.down=false; held.jump=(anim%10)===0; return;}
  if(mode!=='play') return;
  const feet=player.y+PH;
  const floorAt=dist=>{const x=player.x+PW+dist; const ch=tile(Math.floor(x/TS),Math.floor((feet+8)/TS)); return solid(ch)||ch==='=';};
  let gap=true; for(let d=10;d<=42;d+=8) if(floorAt(d)){gap=false; break;}
  const front=Math.floor((player.x+PW+3)/TS);
  const wall=solid(tile(front,Math.floor((player.y+8)/TS)))||solid(tile(front,Math.floor((player.y+PH-6)/TS)));
  const foe=enemies.some(e=>!e.dead&&!e.hide&&!e.hover&&e.kind!=='fly'&&e.x>player.x-8&&e.x<player.x+78&&Math.abs((e.y+e.h)-(player.y+PH))<40);
  if(boss&&!boss.done&&boss.hp>0&&boss.x+boss.w>player.x&&boss.x-player.x<280){
    held.left=false; held.down=false; held.blast=!!(blaster||mounted);
    held.right=(boss.x-player.x)>240;
    held.jump=bubbles.some(b=>b.x<player.x+50&&b.x>player.x-30&&Math.abs(b.y-player.y)<36);
    if(!held.jump&&(gap||wall)&&player.onGround&&held.right) botHold=16;
    if(botHold>0){held.jump=true; botHold--;}
    return;
  }
  held.right=true; held.left=false; held.down=false;
  if((gap||wall||foe)&&player.onGround) botHold=Math.max(botHold,20);
  held.jump=botHold>0; if(botHold>0) botHold--;
  held.blast=!!(foe&&(blaster||mounted));
}

function mergeInput(){
  const pad=fakePad||(function(){const list=navigator.getGamepads?navigator.getGamepads():null; if(!list) return null; for(let i=0;i<list.length;i++) if(list[i]) return list[i]; return null;})();
  const p={left:false,right:false,jump:false,blast:false,down:false,back:false};
  if(pad){const b=pad.buttons||[], ax=pad.axes||[0,0];
    p.left=ax[0]<-0.45||!!(b[14]&&b[14].pressed);
    p.right=ax[0]>0.45||!!(b[15]&&b[15].pressed);
    p.down=ax[1]>0.45||!!(b[13]&&b[13].pressed);
    p.jump=!!(b[0]&&b[0].pressed);
    p.blast=!!(b[2]&&b[2].pressed);
    p.back=!!(b[8]&&b[8].pressed)||!!(b[9]&&b[9].pressed);

}

function ellipsize(text,maxW){
  if(maxW<12) return '';
  if(ctx.measureText(text).width<=maxW) return text;
  let s=text;
  while(s.length>1 && ctx.measureText(s+'…').width>maxW) s=s.slice(0,-1);
  return s.replace(/\s+$/,'')+'…';
}

  for(let i=0;i<96;i++){tickFoe(e); if(e.hide) hid=true; else shown=true;}
  const moved=Math.abs(e.x-x0)>2||Math.abs(e.y-y0)>2||Math.abs(e.vx)>1.5;
  const shot=bolts.length>b0, beamed=beams.length>m0;
  popFoe(e);
  const babies=enemies.filter(f=>f.baby&&!f.dead).length;
  enemies.forEach(f=>{if(f.baby) f.dead=true;});
  bolts.length=b0; beams.length=m0;
  player.x=px; player.y=py; player.vx=pvx;
  return {kind,defeated:!!e.dead,moved,hid:hid&&shown,shot,beamed,babies,logged:!!(save.log&&save.log[kind])};
}

const api={
  KEY, levelIds:()=>ORDER.concat(['w1-s']),
  setManual:v=>{manual=!!v;},
  step:n=>{n=n||1; for(let i=0;i<n;i++) updateStep(); render();},
  botRun:n=>{if(story) dismissStory(); botOn=true; let i=0; for(;i<n&&mode==='play';i++) updateStep(); botOn=false; render(); return {mode,frames:i,x:player.x,lives,id:levelId};},
  warp, reachGoal, give, findBoard, focusMirror, focusSpike, pose,
  mount:()=>{if(!save.buddy){save.buddy=true; spawnBuddy(player.x);} if(!buddy) spawnBuddy(player.x); return doMount();},
  dismount:()=>{if(mounted) releaseBuddy(false); return !mounted;},
  hurt:()=>hurt({force:true}),
  hitBoss:()=>{damageBoss(true); return state();},
  advance:()=>{if(dialog){advanceDialog(); return mode;} if(mode==='unmask'||mode==='clear'||mode==='rest'||mode==='ending'){toMap(); return mode;} if(mode==='intro'){introNext(); return mode;} return mode;},
  unlocked, tuning, resetSave, toMap, getSave:()=>JSON.parse(JSON.stringify(save)),
  state, layout, frameStats,
  press:(name,down)=>{if(name in keys) keys[name]=!!down;},
  foes:()=>enemies.filter(e=>!e.dead).map(e=>({x:e.x,y:e.y,w:e.w,h:e.h,kind:e.kind})),
  parkFoes:()=>{enemies.forEach(e=>{e.vx=0;});},
  resetStats:()=>{samples.length=0;},
  setPad:p=>{fakePad=p;},
  putPlayer:(x,y)=>{player.x=x; player.y=y; player.vx=0; player.vy=0; snapCam();},
  audit:()=>({scale:1,w:PW,h:PH,grows:false,key:KEY}),
  levelFacts:(id)=>{const L=build(BY_ID[id]); let plats=0,tubes=0,pods=0,ramps=0; for(const row of L.grid) for(const ch of row){if(ch==='=')plats++; if(ch==='U')tubes++; if(ch==='q')pods++; if(ch==='R'||ch==='L')ramps++;} return {plats,tubes,pods,ramps,sparks:(L.extras||[]).length};},
  hudRects:()=>lastHud.map(b=>({...b})),
  story:()=>story?{title:story.title,lines:story.lines.slice(),id:levelId}:null,
  skipStory:()=>{dismissStory(); render(); return true;},
  storyFor:(id)=>STORIES[id]?{title:STORIES[id].title,lines:STORIES[id].lines.slice()}:null,
  introCards:()=>INTRO.map(c=>({title:c.title,lines:c.lines.slice()})),
  setStick, stick:()=>({mode:save.stick,nx:stick.nx,ny:stick.ny,on:!!stick.on,left:!!touch.left,right:!!touch.right,down:!!touch.down,jump:!!touch.jump}),
  kinds:()=>FOE_KINDS.slice(),
  sampleFoe, log:()=>({...(save.log||{})}),
  bestiary:()=>FOE_KINDS.map(k=>({kind:k,name:BESTIARY[k].name,line:BESTIARY[k].line,known:!!(save.log&&save.log[k])})),
  openLog:()=>{mode='log'; render();}
};
window.__DREAM__=api;

function bootTouch(){
  const q=params.get('touch');
  const on=q==='1'||(q!=='0'&&(matchMedia('(pointer: coarse)').matches||navigator.maxTouchPoints>0));
  document.body.classList.toggle('touch',on);
  if(poster) document.body.classList.add('poster');
  applyStickMode();
}
function clearStick(){
  stick.on=false; stick.nx=0; stick.ny=0; stick.id=null;
  touch.left=false; touch.right=false; touch.down=false;
  const el=document.getElementById('stick'), knob=document.getElementById('knob');
  if(el) el.classList.remove('hot');
  if(knob){knob.style.setProperty('--kx','0px'); knob.style.setProperty('--ky','0px');}
}
function moveStick(e){
  const el=document.getElementById('stick'), knob=document.getElementById('knob');
  if(!el||!knob) return;
  const r=el.getBoundingClientRect();
  const max=Math.max(24,r.width*0.28);
  let nx=(e.clientX-(r.left+r.width/2))/max;
  let ny=(e.clientY-(r.top+r.height/2))/max;
  nx=Math.max(-1,Math.min(1,nx)); ny=Math.max(-1,Math.min(1,ny));
  const mag=Math.hypot(nx,ny);
  if(mag<0.22){stick.nx=0; stick.ny=0; touch.left=false; touch.right=false; touch.down=false; el.classList.remove('hot'); knob.style.setProperty('--kx','0px'); knob.style.setProperty('--ky','0px'); return;}
  const ang=Math.round(Math.atan2(ny,nx)/(Math.PI/4))*(Math.PI/4);
  const m=Math.min(1,mag), ux=Math.cos(ang)*m, uy=Math.sin(ang)*m;
  stick.on=true; stick.nx=ux; stick.ny=uy;
  touch.left=ux<-0.25; touch.right=ux>0.25; touch.down=uy>0.25;
  el.classList.add('hot');
  knob.style.setProperty('--kx',(ux*26)+'px');
  knob.style.setProperty('--ky',(uy*26)+'px');
}
bootTouch();
{
  const el=document.getElementById('stick');
  if(el){
    el.addEventListener('pointerdown',e=>{e.preventDefault(); stick.id=e.pointerId; stick.on=true; moveStick(e); try{el.setPointerCapture(e.pointerId);}catch(err){} armAudio();});
    el.addEventListener('pointermove',e=>{if(e.pointerId!==stick.id) return; moveStick(e);});
    const up=e=>{if(stick.id!=null&&e.pointerId!==stick.id) return; clearStick();};
    el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up);
  }
}
for(const btn of document.querySelectorAll('.ctl')){
  const act=btn.dataset.act;
  btn.addEventListener('pointerdown',e=>{e.preventDefault(); try{btn.setPointerCapture(e.pointerId);}catch(err){} touch[act]=true; btn.classList.add('hot'); btn.setAttribute('aria-pressed','true'); armAudio();});
  const up=e=>{touch[act]=false; btn.classList.remove('hot'); btn.setAttribute('aria-pressed','false'); try{btn.releasePointerCapture(e.pointerId);}catch(err){}};
  btn.addEventListener('pointerup',up); btn.addEventListener('pointercancel',up);
  btn.addEventListener('focus',()=>btn.classList.add('sel'));
  btn.addEventListener('blur',()=>btn.classList.remove('sel'));
}
const KEYMAP={ArrowLeft:'left',ArrowRight:'right',ArrowDown:'down',ArrowUp:'jump',a:'left',d:'right',s:'down',w:'jump',' ':'jump',z:'jump',k:'jump',Enter:'jump',x:'blast',j:'blast',Escape:'back',Backspace:'back'};
addEventListener('keydown',e=>{const a=KEYMAP[e.key]; if(!a) return; e.preventDefault(); keys[a]=true; armAudio();});
addEventListener('keyup',e=>{const a=KEYMAP[e.key]; if(!a) return; e.preventDefault(); keys[a]=false;});
addEventListener('blur',()=>{for(const k in keys) keys[k]=false;});
canvas.addEventListener('pointerdown',e=>{if(poster) return; armAudio(); if(mode==='title'||mode==='clear'||mode==='rest'||mode==='ending'||mode==='intro'||mode==='unmask'){keys.jump=true; setTimeout(()=>{keys.jump=false;},30);} });
addEventListener('contextmenu',e=>e.preventDefault());

loadSave(); applyStickMode(); hero=save.awake?'skippy':'santt'; sel=save.node&&BY_ID[save.node]?save.node:'w1-1';
if(poster==='og'){canvas.width=1200; canvas.height=630; canvas.style.width='1200px'; canvas.style.height='630px';}
else if(poster==='card'){canvas.width=600; canvas.height=800; canvas.style.width='600px'; canvas.style.height='800px';}
let lastT=0, acc=0; const STEP=1000/60;
function frame(t){
  const dt=lastT?Math.min(80,t-lastT):16.7; lastT=t; samples.push(dt); if(samples.length>480) samples.shift();
  if(!manual&&!poster){acc+=dt; let n=0; while(acc>=STEP&&n<5){updateStep(); acc-=STEP; n++;}}
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
