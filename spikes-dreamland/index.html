function fresh(){return {v:1,cleared:{},secrets:{},buddy:false,boardFound:false,boardReplay:false,boardOn:false,sparks:0,lives:5,node:'w1-1',aura:false,blaster:false,seenIntro:false,drill:false,awake:false,hero:'santt'};}
let save=fresh();
function loadSave(){try{const raw=localStorage.getItem(KEY); if(!raw) return; const d=JSON.parse(raw); if(!d||d.v!==1) return; save=Object.assign(fresh(),d); if(!save.cleared||typeof save.cleared!=='object') save.cleared={}; if(!save.secrets||typeof save.secrets!=='object') save.secrets={};}catch(e){}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}
function resetSave(){try{localStorage.removeItem(KEY);}catch(e){} save=fresh(); hero='santt'; mode='title'; dialog=null; botOn=false;}

function armAudio(){if(audioOn) return; audioOn=true; try{const AC=window.AudioContext||window.webkitAudioContext; if(AC) actx=new AC();}catch(e){actx=null;}}
function tone(freq,dur,type,gain){if(!audioOn||!actx||manual) return; try{const o=actx.createOscillator(),g=actx.createGain(); o.type=type||'square'; o.frequency.value=freq; g.gain.setValueAtTime(gain||0.03,actx.currentTime); g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+dur); o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+dur);}catch(e){}}
function sfx(n){if(n==='jump') tone(420,0.08,'square',0.03); else if(n==='blast') tone(680,0.09,'square',0.035); else if(n==='zap') tone(520,0.07,'triangle',0.03); else if(n==='pop') tone(300,0.1,'triangle',0.04); else if(n==='item') tone(660,0.12,'triangle',0.04); else if(n==='hurt') tone(180,0.14,'sawtooth',0.03); else if(n==='goal'){tone(523,0.12,'square',0.04); tone(659,0.16,'square',0.03);} else if(n==='mount') tone(360,0.1,'triangle',0.03);}

function banner(t){bannerText=t; bannerT=150;}
function burst(x,y,n,kind){const cols=kind==='sparkle'?['#fff','#9ef6ff','#ffe08a','#ffc0ea']:['#ffd0ea','#c8fff0','#ffe9a0','#d0c0ff']; for(let i=0;i<n;i++){parts.push({x,y,vx:(Math.random()-0.5)*2.4,vy:-Math.random()*2.2-0.2,life:22+Math.random()*16,r:2+Math.random()*3,c:cols[i%cols.length],k:kind||'fluff'});} if(parts.length>140) parts.splice(0,parts.length-140);}
function tickParts(){if(bannerT>0) bannerT--; for(let i=parts.length-1;i>=0;i--){const p=parts[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.04; p.life--; if(p.life<=0) parts.splice(i,1);}}

function solid(ch){return ch==='#'||ch==='>'||ch==='<';}
function tile(tx,ty){if(!level) return '.'; if(tx<0||tx>=level.w) return '#'; if(ty<0||ty>=ROWS) return '.'; return level.grid[ty][tx];}
function findTiles(ch){const o=[]; if(!level) return o; for(let y=0;y<ROWS;y++) for(let x=0;x<level.w;x++) if(level.grid[y][x]===ch) o.push({tx:x,ty:y}); return o;}
function findTile(ch){return findTiles(ch)[0]||null;}
function overlap(a,b){return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;}
function rectTiles(x,y,w,h){const x0=Math.floor(x/TS),x1=Math.floor((x+w-0.01)/TS),y0=Math.floor(y/TS),y1=Math.floor((y+h-0.01)/TS),o=[]; for(let ty=y0;ty<=y1;ty++) for(let tx=x0;tx<=x1;tx++) o.push({tx,ty,ch:tile(tx,ty)}); return o;}

function build(def){
  const W=def.w, grid=Array.from({length:ROWS},()=>Array(W).fill('.'));
  const gaps=def.gaps||[];
  const inGap=x=>gaps.some(([a,b])=>x>=a&&x<b);
  for(let x=0;x<W;x++){ if(!inGap(x)){grid[13][x]='#'; grid[14][x]='#';} else grid[14][x]='~'; }
  for(const p of def.plats||[]){ for(let i=0;i<p[2];i++){const x=p[0]+i; if(x>=0&&x<W&&p[1]>=0&&p[1]<ROWS) grid[p[1]][x]='=';} }
  for(const b of def.belts||[]){ for(let i=0;i<b.len;i++){const x=b.x+i; if(x>=0&&x<W&&(grid[b.y][x]==='#'||grid[b.y][x]==='=')) grid[b.y][x]=b.ch;} }
  grid[11][def.goal]='|'; grid[12][def.goal]='|';
  if(def.secret!=null){ grid[def.secretY][def.secret]='S'; }
  for(const c of def.check||[]) grid[12][c]='c';
  const stamp=(ch,arr)=>{ for(const it of arr||[]){ const x=it[0], y=it[1]; if(y>=0&&y<ROWS&&x>=0&&x<W) grid[y][x]=ch; } };
  stamp('+',def.cross); stamp('F',def.blaster); stamp('o',def.sparks?def.sparks.map(x=>[x,12]):[]);
  if(def.board) grid[def.board[1]][def.board[0]]='B';
  if(def.buddy) grid[12][def.buddy]='Y';
  if(grid[13][def.start]!=='#'&&grid[13][def.start]!=='>') throw new Error('start air '+def.id);
  if(grid[13][def.goal]!=='#'&&grid[13][def.goal]!=='>') throw new Error('goal air '+def.id);
  for(const tx of def.walkers||[]) if(grid[13][tx]!=='#'&&grid[13][tx]!=='>') throw new Error('walker gap '+def.id+' '+tx);
  if(def.secret!=null){ const ch=grid[def.secretY+1][def.secret]; if(ch!=='='&&ch!=='<'&&ch!=='>'&&ch!=='#') throw new Error('secret plat '+def.id); }
  if(def.board){ const ch=grid[def.board[1]+1][def.board[0]]; if(ch!=='='&&!solid(ch)) throw new Error('board plat '+def.id); }
  return {def,grid,w:W,world:def.world,name:def.name,id:def.id,low:def.low||null,tips:def.tips||[]};
}

function bootLevel(def){
  level=build(def); levelId=def.id; won=false; goalLock=!!(def.boss||def.mirrors); dialog=null; bolts=[]; bubbles=[]; rings=[]; drops=[]; illusions=[]; parts=[]; inputLog=[]; saidSign={}; glitchT=0; inv=40; cool=0; dropT=0; flutter=FLUTTER_MAX; mounted=false; face=1; botHold=0; shots=0; bannerT=0; bannerText='';
  enemies=[]; items=[]; movers=[]; queue=[]; boss=null; buddy=null;
  const addItem=(kind,tx,ty)=>({kind,x:tx*TS+2,y:ty*TS+2,w:28,h:28,alive:true,tx,ty});
  for(const it of def.cross||[]) items.push(addItem('cross',it[0],it[1]));
  for(const it of def.blaster||[]) items.push(addItem('blast',it[0],it[1]));
  for(const x of def.sparks||[]) items.push(addItem('spark',x,12));
  if(def.board) items.push(addItem('board',def.board[0],def.board[1]));
  if(def.buddy) items.push(addItem('buddy',def.buddy,12));
  for(const s of def.signs||[]) items.push({kind:'sign',x:s.x*TS,y:12*TS,w:TS,h:TS,alive:true,msg:s.m});
  if(def.drill!=null) items.push({kind:'drill',x:def.drill*TS,y:GY*TS-58,w:36,h:58,alive:true});
  for(const tx of def.walkers||[]) enemies.push({kind:'walk',x:tx*TS+2,y:GY*TS-32,w:28,h:32,vx:0.7,vy:0,dead:false});

function checkGoals(){

function playFrame(pr){

  if(held.right&&!held.left) face=1;
  const tun=tuning();
  const acc=player.onGround?(boardMode?0.5:0.32):0.14;
  if(held.left&&!held.right) player.vx-=acc+(player.onGround&&player.vx>0?0.28:0);

  if(pr.jump) jbuf=8; else if(jbuf>0) jbuf--;
  if(pr.relJump&&player.vy<0) player.vy*=0.55;
  if(jbuf>0&&(player.onGround||coyote>0)&&!(pr.down&&player.onOneWay)){
    player.vy=tun.jump; player.onGround=false; coyote=0; jbuf=0; sfx('jump');
  }
  if(pr.down&&mounted&&player.onGround) releaseBuddy(false);
  else if(pr.down&&player.onGround&&player.onOneWay){player.y+=6; player.onGround=false; dropT=8;}
  if(mounted&&!player.onGround&&held.jump&&flutter>0&&player.vy>-1){player.vy=Math.min(player.vy,0.35)-0.12; flutter--;}
  if(player.onGround&&flutter<FLUTTER_MAX) flutter+=1.2;
  player.vy+=tun.grav; if(player.vy>12) player.vy=12;
  const py=player.y; moveBody(player,py);
  for(const m of movers){
    m.x+=m.dir*0.85; if(m.x>m.origin+m.range){m.x=m.origin+m.range; m.dir=-1;} if(m.x<m.origin){m.x=m.origin; m.dir=1;} m.vx=m.dir*0.85;
    if(player.vy<0||dropT>0) continue;
    const prevFeet=py+PH, feet=player.y+PH;
    const ox=player.x+PW>m.x+4 && player.x<m.x+m.w-4;
    if(ox&&prevFeet<=m.y+4&&feet>=m.y&&feet<=m.y+18){player.y=m.y-PH; player.vy=0; player.onGround=true; player.onOneWay=true; player.x+=m.vx;}
  }

    buddy.vy=Math.min(8,(buddy.vy||0)+0.7);
    const target=player.x-36*face; buddy.vx+=(target-buddy.x)*0.02; buddy.vx=Math.max(-2.2,Math.min(2.2,buddy.vx));
    const by=buddy.y; moveBody(buddy,by);

  }

  for(const b of bubbles){b.x+=b.vx; b.y+=Math.sin(anim/10+b.ph)*0.4; b.life--;}
  for(const r of rings){r.r+=r.grow||0; r.life--; r.ang=(r.ang||0)+0.06;}
  for(const d of drops){d.y+=d.vy; d.life--;}
  fightHits();
  for(let i=bolts.length-1;i>=0;i--) if(bolts[i].life<=0) bolts.splice(i,1);
  for(let i=bubbles.length-1;i>=0;i--) if(bubbles[i].life<=0) bubbles.splice(i,1);
  for(let i=rings.length-1;i>=0;i--) if(rings[i].life<=0) rings.splice(i,1);
  for(let i=drops.length-1;i>=0;i--) if(drops[i].life<=0||drops[i].y>GY*TS) drops.splice(i,1);

  if(player.y>ROWS*TS+10) hurt({pit:true});

  cam.x+=(target-cam.x)*0.16; if(cam.x<0) cam.x=0; if(cam.x>max) cam.x=max; cam.y=0;
  if(anim%22===0&&mode==='play'){const notes=[523,587,659,784,659,587]; tone(notes[(anim/22|0)%notes.length]*(level.world===4?0.5:level.world===2?0.75:1),0.12,'triangle',0.02);}
}
function dangerLine(){return boss?boss.minX-8:1e9;}

function fightHits(){
  for(const e of enemies){
    if(e.dead||!overlap(player,e)) continue;
    const prev=player.y+PH-player.vy;
    if(player.vy>0&&prev<=e.y+10){popFoe(e); player.vy=held.jump?-9:-6; continue;}
    if(mounted){popFoe(e); continue;}
    hurt();
  }
  if(boss&&!boss.done&&overlap(player,boss)){
    const prev=player.y+PH-player.vy;
    if(player.vy>0&&prev<=boss.y+14){damageBoss(false); player.vy=held.jump?-9:-6.4;}
    else hurt();
  }
  for(const il of illusions){if(!il.dead&&overlap(player,il)) hurt();}
  for(const b of bolts){
    if(b.life<=0) continue;
    if(b.side==='foe'){
      if(boss&&b.x<dangerLine()){b.life=0; burst(dangerLine(),b.y,5,'sparkle'); continue;}
      if(overlap(b,player)){b.life=0; hurt();}
      for(const p of bolts){if(p.side==='me'&&p.life>0&&overlap(b,p)){b.life=0; p.life=0; burst(b.x,b.y,6,'sparkle');}}
    } else {
      for(const e of enemies){if(!e.dead&&overlap(b,e)){b.life=0; popFoe(e);}}
      if(boss&&!boss.done&&overlap(b,boss)){b.life=0; damageBoss(false);}
      for(const il of illusions){if(!il.dead&&overlap(b,il)){b.life=0; il.dead=true; burst(il.x,il.y,8,'sparkle');}}
      for(const bb of bubbles){if(bb.life>0&&overlap(b,bb)){b.life=0; bb.life=0; burst(bb.x,bb.y,6,'fluff');}}
      for(const d of drops){if(d.life>0&&overlap(b,d)){b.life=0; d.life=0; burst(d.x,d.y,5,'sparkle');}}
    }
  }
  for(const bb of bubbles){if(bb.life<=0) continue; if(boss&&bb.x<dangerLine()){bb.life=0; burst(dangerLine(),bb.y,5,'sparkle'); continue;} if(overlap(bb,player)){bb.life=0; hurt();}}
  for(const d of drops){if(d.life>0&&overlap(d,player)){d.life=0; if(!safeStand()) hurt(); else {d.life=0;}}}
  for(const r of rings){
    if(!r.hurt){
      if(r.orb){const ox=r.x+Math.cos(r.ang)*r.r, oy=r.y+Math.sin(r.ang)*r.r; if(!safeStand()&&Math.abs(player.x-ox)<16&&Math.abs(player.y-oy)<16) hurt();}
      continue;
    }
    const cx=player.x+PW/2, cy=player.y+PH*0.7, dist=Math.hypot(cx-r.x,cy-r.y);
    if(Math.abs(dist-r.r)<18 && player.x+PW>dangerLine()-10) hurt();
  }
}

function botThink(){
  if(dialog){held.left=held.right=held.blast=held.back=held.down=false; held.jump=(anim%10)===0; return;}
  if(mode!=='play') return;
  const feet=player.y+PH;
  const floorAt=dist=>{const x=player.x+PW+dist; const ch=tile(Math.floor(x/TS),Math.floor((feet+8)/TS)); return solid(ch)||ch==='=';};
  let gap=true; for(let d=10;d<=42;d+=8) if(floorAt(d)){gap=false; break;}
  const wall=solid(tile(Math.floor((player.x+PW+4)/TS),Math.floor((player.y+12)/TS)));
  const foe=enemies.some(e=>!e.dead&&e.kind!=='fly'&&e.x>player.x-8&&e.x<player.x+78&&Math.abs((e.y+e.h)-(player.y+PH))<40);
  if(boss&&!boss.done&&boss.hp>0&&boss.x+boss.w>player.x&&boss.x-player.x<280){
    held.left=false; held.down=false; held.blast=!!(blaster||mounted);
    held.right=(boss.x-player.x)>240;
    held.jump=bubbles.some(b=>b.x<player.x+50&&b.x>player.x-30&&Math.abs(b.y-player.y)<36);
    if(!held.jump&&(gap||wall)&&player.onGround&&held.right) botHold=16;
    if(botHold>0){held.jump=true; botHold--;}
    return;
  }
  held.right=true; held.left=false; held.down=false;
  if((gap||wall||foe)&&player.onGround) botHold=Math.max(botHold,20);
  held.jump=botHold>0; if(botHold>0) botHold--;

}

  else if(mode==='map') mapInput(pr);

  wasHeld={left:held.left,right:held.right,jump:held.jump,blast:held.blast,down:held.down,back:held.back};

  const token=POS[sel];
  if(hero==='skippy'||save.awake) paintSkippy(ctx,token[0],token[1]-16,{s:0.7});
  else paintSantt(ctx,token[0],token[1]-16,{s:0.7,face:1});
  ctx.restore();
  ctx.fillStyle='rgba(6,8,20,.6)'; ctx.fillRect(0,0,VW,36); ctx.fillStyle='#fff'; ctx.font='bold 16px Trebuchet MS'; ctx.textAlign='center';
  ctx.fillText("SPIKE'S DREAMLAND  ·  Let's Ride!",VW/2,24);
  ctx.font='13px Trebuchet MS'; ctx.fillText((save.boardReplay?(save.boardOn?'SPACE BOARD ON':'SPACE BOARD OFF — DOWN to toggle'):'LEFT RIGHT choose    JUMP rides') ,VW/2,520);
}
function drawPoster(kind){
  const w=canvas.width,h=canvas.height; cam.x=0;
  const grd=ctx.createLinearGradient(0,0,0,h); grd.addColorStop(0,'#140820'); grd.addColorStop(1,'#3a1868'); ctx.fillStyle=grd; ctx.fillRect(0,0,w,h);
  ctx.fillStyle='#fff'; for(let i=0;i<80;i++) ctx.fillRect((i*97)%w,(i*53)%h,2,2);
  ctx.fillStyle='#d7c6ff'; ctx.beginPath(); ctx.ellipse(w*0.8,h*0.28,90,36,0,0,7); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.6)'; ctx.lineWidth=5; ctx.beginPath(); ctx.ellipse(w*0.8,h*0.28,140,30,-0.4,0,7); ctx.stroke();
  ctx.fillStyle='#fff'; ctx.textAlign='center';
  if(kind==='og'){
    ctx.font='bold 72px Trebuchet MS'; ctx.fillText("SPIKE'S DREAMLAND",w/2,120);
    ctx.fillStyle='#ffd56a'; ctx.font='bold 36px Trebuchet MS'; ctx.fillText("Let's Ride!",w/2,180);
    paintSpike(ctx,220,520,{s:3.2,smile:true});
    paintSkippyHeadset(ctx,520,540,3.1,false);
    ctx.strokeStyle='#9ee7ff'; ctx.lineWidth=6; ctx.beginPath(); ctx.arc(960,360,120,0,7); ctx.stroke();
    ctx.save(); ctx.beginPath(); ctx.arc(960,360,110,0,7); ctx.clip(); paintSantt(ctx,960,430,{s:2.8,aura:true,face:1}); ctx.restore();
    drawCross(ctx,1040,120,40);
  } else {
    ctx.font='bold 42px Trebuchet MS'; ctx.fillText("SPIKE'S DREAMLAND",w/2,70);
    ctx.fillStyle='#ffd56a'; ctx.font='22px Trebuchet MS'; ctx.fillText("Let's Ride!",w/2,110);
    paintSkippy(ctx,300,640,{s:4.2,aura:true});
    drawBoard(ctx,300,650,2);
    paintSantt(ctx,140,430,{s:2.2,face:1});
    paintSpike(ctx,470,400,{s:2.4,smile:true});
    drawCross(ctx,500,180,48);
    drawBlasterGun(ctx,120,200,1.6);
    ctx.fillStyle='#fff'; ctx.font='16px Trebuchet MS'; ctx.fillText('A dream link. Then the hall of mirrors.',w/2,760);
  }
}
function render(){
  if(poster){drawPoster(poster); return;}
  ctx.clearRect(0,0,VW,VH);
  if(mode==='title') return drawTitle();
  if(mode==='intro') return drawIntro();
  if(mode==='map') return drawMap();
  if(mode==='unmask') return drawUnmask();
  if(mode==='ending') return drawEnding();
  if(level){drawWorld(); drawHUD();}
  if(dialog&&mode==='play') drawDialog();
  if(mode==='pause') drawPause();
  if(mode==='clear') drawClear();
  if(mode==='rest') drawRest();
}

function state(){
  return {mode,levelId,hero,awake:!!save.awake,aura:!!aura,blaster:!!blaster,mounted:!!mounted,lives,inv,glitch:glitchT,boardFound:!!save.boardFound,boardReplay:!!save.boardReplay,boardMode:!!boardMode,sparks,cleared:{...save.cleared},secrets:{...save.secrets},shots,scale:1,w:player.w,h:player.h,phase:boss&&boss.kind==='spike'?boss.phase:0,smile:!!(boss&&boss.smile)||mode==='ending',quote,mirror:boss&&boss.kind==='mirror'?boss.twist:null,bossName:boss?boss.name:null,bossHp:boss?boss.hp:0,bossX:boss?boss.x:0,bossDone:!!(boss&&boss.done),dialog:!!dialog,world:level?level.world:0,foes:enemies.filter(e=>!e.dead).length,fluff:parts.filter(p=>p.k==='fluff'||p.k==='sparkle').length,queue:queue.length,buddyOut:!!(buddy&&!buddy.hidden),node:sel};
}
function layout(){
  const cv=canvas.getBoundingClientRect();
  const ctrls=[...document.querySelectorAll('.ctl')].filter(b=>b.getClientRects().length).map(b=>{const r=b.getBoundingClientRect(); return {id:b.dataset.act,label:(b.textContent||'').trim(),x:r.x,y:r.y,w:r.width,h:r.height,hot:b.classList.contains('hot')||b.classList.contains('sel')};});
  const cx=cv.x+cv.width/2, cy=cv.y+cv.height/2;
  const centerCovered=ctrls.some(r=>cx>=r.x&&cx<=r.x+r.w&&cy>=r.y&&cy<=r.y+r.h);
  const onScreen=ctrls.every(r=>r.x>=-2&&r.y>=-2&&r.x+r.w<=innerWidth+2&&r.y+r.h<=innerHeight+2);
  return {ctrls,centerCovered,onScreen,touch:document.body.classList.contains('touch'),vw:innerWidth,vh:innerHeight,canvas:{x:cv.x,y:cv.y,w:cv.width,h:cv.height}};
}
function frameStats(){if(!samples.length) return {p95:null,n:0,p50:null,max:null}; const s=samples.slice().sort((a,b)=>a-b); const at=q=>s[Math.min(s.length-1,Math.floor((s.length-1)*q))]; return {p95:at(0.95),p50:at(0.5),max:s[s.length-1],n:s.length};}
function reachGoal(secret){
  if(mode==='clear'||mode==='ending'||mode==='unmask') return true;
  if(!level) return false;
  mode='play'; dialog=null; if(lives<=0) lives=3;
  if(level.def.boss&&level.def.boss.kind==='spike'){
    let guard=0; while(boss&&!boss.done&&guard++<30) damageBoss(true); 
    let k=0; while(dialog&&k++<6) advanceDialog();
    return mode==='ending'&&!!save.boardReplay;
  }
  if(secret){const s=findTile('S'); if(!s) return false; player.x=s.tx*TS; player.y=s.ty*TS; checkGoals(); return !!save.secrets[level.id];}
  let guard=0; while(goalLock&&boss&&guard++<12){let h=0; while(boss&&boss.hp>0&&h++<8) damageBoss(true); }
  goalLock=false;
  const s=findTile('|'); if(!s) return false;
  player.x=s.tx*TS; player.y=s.ty*TS; checkGoals();
  return !!(save.cleared[level.id]||mode==='unmask'||mode==='ending');
}
function give(kind){items.push({kind, x:player.x, y:player.y, w:28, h:28, alive:true, tx:-1, ty:-1}); checkItems();}
function findBoard(){const s=findTile('B'); if(!s) return false; const it=items.find(i=>i.kind==='board'&&i.alive); if(it){player.x=it.x; player.y=it.y;} else {player.x=s.tx*TS; player.y=s.ty*TS;} checkItems(); return !!save.boardFound;}
function focusMirror(twist){const id=twist==='hop'?'w5-3':'w5-2'; warp(id); const all=[boss].concat(queue).filter(Boolean); const m=all.find(b=>b.twist===twist)||boss; queue=[]; boss=m; boss.hp=boss.max; boss.done=false; goalLock=true; player.x=Math.max(8,boss.minX-170); player.y=GY*TS-PH; player.vx=0; cam.x=Math.max(0,player.x-180); inputLog=[]; render();}
function focusSpike(phase){warp('w5-c'); boss.phase=phase; boss.hp=boss.max; boss.done=false; boss.smile=phase===3; goalLock=true; illusions=[]; rings=[]; drops=[]; player.x=Math.max(8,boss.minX-180); player.y=GY*TS-PH; cam.x=Math.max(0,player.x-200); if(phase===1) rings.push({x:boss.x+30,y:boss.y+24,r:48,grow:0,life:200,orb:true,ang:0.4}); if(phase===2) illusions=[{x:boss.x-80,y:boss.y-80,w:42,h:60,vx:0.4,dead:false},{x:boss.x+90,y:boss.y-70,w:42,h:60,vx:-0.4,dead:false}]; if(phase===3){drops.push({x:boss.x-20,y:120,vy:0,w:18,h:18,life:200}); boss.smile=true;} banner(phase===1?'SPIKE: Show me you can see clearly.':phase===2?'SPIKE: Which one is true?':'SPIKE: Last light. See it clearly.'); render();}
function pose(name,arg){
  if(name==='title') mode='title';
  else if(name==='tent'){mode='intro'; introI=0; introT=90;}
  else if(name==='headset'){mode='intro'; introI=3; introT=40;}
  else if(name==='headsetOff'){mode='unmask'; unmaskT=180; hero='skippy';}
  else if(name==='map') toMap();
  else if(name==='ending'){quote=QUOTE; mode='ending'; endT=30; hero='skippy';}
  else if(name==='world') warp(arg||'w1-1');
  else if(name==='aura'){warp('w1-1'); aura=true;}
  else if(name==='buddy'){warp('w1-2'); save.buddy=true; spawnBuddy(player.x); doMount();}
  else if(name==='blaster'){warp('w1-3'); blaster=true; aura=true; face=1; tryFire();}
  else if(name==='board'){if(save.boardReplay) warp('w2-1',{board:true}); else {warp('w2-3'); const b=items.find(i=>i.kind==='board'); if(b){player.x=b.x-80; cam.x=Math.max(0,b.x-300);} }}
  else if(name==='fright'){warp('w4-c'); player.x=Math.max(8,boss.minX-160); player.y=GY*TS-PH; cam.x=Math.max(0,player.x-180);} 
  else if(name==='hall') warp('w5-1');
  render();
}
function snapCam(){const max=Math.max(0,(level?level.w*TS:VW)-VW); cam.x=Math.max(0,Math.min(player.x+PW/2-VW*0.4,max));}

const api={
  KEY, levelIds:()=>ORDER.concat(['w1-s']),
  setManual:v=>{manual=!!v;},
  step:n=>{n=n||1; for(let i=0;i<n;i++) updateStep(); render();},
  botRun:n=>{botOn=true; let i=0; for(;i<n&&mode==='play';i++) updateStep(); botOn=false; render(); return {mode,frames:i,x:player.x,lives,id:levelId};},
  warp, reachGoal, give, findBoard, focusMirror, focusSpike, pose,
  mount:()=>{if(!save.buddy){save.buddy=true; spawnBuddy(player.x);} if(!buddy) spawnBuddy(player.x); return doMount();},
  dismount:()=>{if(mounted) releaseBuddy(false); return !mounted;},
  hurt:()=>hurt({force:true}),
  hitBoss:()=>{damageBoss(true); return state();},
  advance:()=>{if(dialog){advanceDialog(); return mode;} if(mode==='unmask'||mode==='clear'||mode==='rest'||mode==='ending'){toMap(); return mode;} if(mode==='intro'){introNext(); return mode;} return mode;},
  unlocked, tuning, resetSave, toMap, getSave:()=>JSON.parse(JSON.stringify(save)),
  state, layout, frameStats,
  press:(name,down)=>{if(name in keys) keys[name]=!!down;},
  foes:()=>enemies.filter(e=>!e.dead).map(e=>({x:e.x,y:e.y,w:e.w,h:e.h,kind:e.kind})),
  parkFoes:()=>{enemies.forEach(e=>{e.vx=0;});},
  resetStats:()=>{samples.length=0;},
  setPad:p=>{fakePad=p;},
  putPlayer:(x,y)=>{player.x=x; player.y=y; player.vx=0; player.vy=0; snapCam();},
  audit:()=>({scale:1,w:PW,h:PH,grows:false,key:KEY})
};
window.__DREAM__=api;

function bootTouch(){
  const q=params.get('touch');
  const on=q==='1'||(q!=='0'&&(matchMedia('(pointer: coarse)').matches||navigator.maxTouchPoints>0));
  document.body.classList.toggle('touch',on);
  if(poster) document.body.classList.add('poster');
}
bootTouch();
for(const btn of document.querySelectorAll('.ctl')){
  const act=btn.dataset.act;
  btn.addEventListener('pointerdown',e=>{e.preventDefault(); try{btn.setPointerCapture(e.pointerId);}catch(err){} touch[act]=true; btn.classList.add('hot'); btn.setAttribute('aria-pressed','true'); armAudio();});
  const up=e=>{touch[act]=false; btn.classList.remove('hot'); btn.setAttribute('aria-pressed','false'); try{btn.releasePointerCapture(e.pointerId);}catch(err){}};
  btn.addEventListener('pointerup',up); btn.addEventListener('pointercancel',up);
  btn.addEventListener('focus',()=>btn.classList.add('sel'));
  btn.addEventListener('blur',()=>btn.classList.remove('sel'));
}
const KEYMAP={ArrowLeft:'left',ArrowRight:'right',ArrowDown:'down',ArrowUp:'jump',a:'left',d:'right',s:'down',w:'jump',' ':'jump',z:'jump',k:'jump',Enter:'jump',x:'blast',j:'blast',Escape:'back',Backspace:'back'};
addEventListener('keydown',e=>{const a=KEYMAP[e.key]; if(!a) return; e.preventDefault(); keys[a]=true; armAudio();});
addEventListener('keyup',e=>{const a=KEYMAP[e.key]; if(!a) return; e.preventDefault(); keys[a]=false;});
addEventListener('blur',()=>{for(const k in keys) keys[k]=false;});
canvas.addEventListener('pointerdown',e=>{if(poster) return; armAudio(); if(mode==='title'||mode==='clear'||mode==='rest'||mode==='ending'||mode==='intro'||mode==='unmask'){keys.jump=true; setTimeout(()=>{keys.jump=false;},30);} });
addEventListener('contextmenu',e=>e.preventDefault());

loadSave(); hero=save.awake?'skippy':'santt'; sel=save.node&&BY_ID[save.node]?save.node:'w1-1';
if(poster==='og'){canvas.width=1200; canvas.height=630; canvas.style.width='1200px'; canvas.style.height='630px';}
else if(poster==='card'){canvas.width=600; canvas.height=800; canvas.style.width='600px'; canvas.style.height='800px';}
let lastT=0, acc=0; const STEP=1000/60;
function frame(t){
  const dt=lastT?Math.min(80,t-lastT):16.7; lastT=t; samples.push(dt); if(samples.length>480) samples.shift();
  if(!manual&&!poster){acc+=dt; let n=0; while(acc>=STEP&&n<5){updateStep(); acc-=STEP; n++;}}
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
